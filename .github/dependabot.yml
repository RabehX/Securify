version: 2

updates:
  # Gradle dependencies (version catalog)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all-dependencies:
        patterns:
          - "*"
    labels:
      - "dependencies"
    open-pull-requests-limit: 1

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      all-actions:
        patterns:
          - "*"
    labels:
      - "ci"
    open-pull-requests-limit: 1

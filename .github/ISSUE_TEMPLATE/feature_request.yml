name: Feature Request
description: Propose a new security check, detection heuristic, or UX improvement for Securify
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Securify more comprehensive or user-friendly?
        Please describe your proposed feature or enhancement below.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What limitation, new root hiding technique, or security aspect does this feature address?
      placeholder: Describe the problem or security scenario...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Explain the proposed capability, detection routine, or user experience change.
      placeholder: Detailed description of what should happen and how it benefits the user...
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Feature Domain
      description: Select the functional domain for this feature.
      options:
        - "Root & Privilege Escalation Detection (Magisk, KernelSU, APatch)"
        - "Google Play Integrity API Checks"
        - "Hardware, ABI & Kernel Diagnostics"
        - "User Interface & Material 3 Expressive Theming"
        - "Diagnostic Exporting & System Log Auditing"
        - "Localization & Accessibility"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative workarounds or implementations you have considered.
      placeholder: Any alternate approaches or existing third-party tools...
    validations:
      required: false
